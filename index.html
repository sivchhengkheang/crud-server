<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome - Modern Landing Page</title>
    <style>
      /* Base Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #f4f7f6;
        color: #333;
        line-height: 1.6;
      }

      /* Navigation */
      nav {
        background-color: white;
        padding: 1rem 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: #4f46e5;
        text-decoration: none;
      }

      /* Hero Section */
      .hero {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: white;
        padding: 5rem 2rem 7rem 2rem;
        text-align: center;
      }

      .hero h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
        font-weight: 800;
      }

      .hero p {
        font-size: 1.2rem;
        max-width: 600px;
        margin: 0 auto;
        opacity: 0.9;
      }

      /* Form Card Layout */
      .card-container {
        max-width: 500px;
        margin: -4rem auto 3rem auto; /* Negative top margin pulls it up over the hero */
        padding: 0 1rem;
      }

      .interactive-card {
        background: white;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .interactive-card h2 {
        margin-bottom: 1.5rem;
        text-align: center;
        color: #1f2937;
      }

      /* Form Elements */
      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #4b5563;
      }

      input {
        padding: 0.75rem;
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      button {
        width: 100%;
        padding: 0.875rem;
        background-color: #4f46e5;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: #4338ca;
      }

      #statusMessage {
        margin-top: 1rem;
        font-weight: 600;
        text-align: center;
      }

      /* Footer */
      footer {
        text-align: center;
        padding: 2rem;
        color: #6b7280;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav>
      <a href="#" class="logo">MyDataApp</a>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
      <h1>Transform Your Workflow</h1>
      <p>
        The fastest and most secure way to send your data directly to the
        server. Get started instantly below.
      </p>
    </header>

    <!-- Floating Form Section -->
    <main class="card-container">
      <div class="interactive-card">
        <h2>Send Data to Server</h2>

        <div class="form-group">
          <label for="userInput">Enter your payload:</label>
          <input
            type="text"
            id="userInput"
            placeholder="Type something amazing here..."
          />
        </div>

        <button id="sendButton">Submit Now</button>
        <div id="statusMessage"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 MyDataApp. All rights reserved.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
      const sendButton = document.getElementById("sendButton");
      const userInput = document.getElementById("userInput");
      const statusMessage = document.getElementById("statusMessage");

      sendButton.addEventListener("click", async () => {
        const data = userInput.value;

        if (!data) {
          statusMessage.textContent = "Please enter some text first.";
          statusMessage.style.color = "#ef4444"; // Red color
          return;
        }

        statusMessage.textContent = "Sending...";
        statusMessage.style.color = "#4b5563"; // Gray color

        try {
          // Point this to your new Express POST route
          const serverUrl = "/submit-data";

          const response = await fetch(serverUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ inputData: data }),
          });

          if (response.ok) {
            statusMessage.textContent = "Success! Data sent to server.";
            statusMessage.style.color = "#10b981"; // Green color
            userInput.value = "";
          } else {
            statusMessage.textContent = "Server error. Please try again.";
            statusMessage.style.color = "#ef4444"; // Red color
          }
        } catch (error) {
          console.error("Fetch error:", error);
          statusMessage.textContent = "Network error. Check your console.";
          statusMessage.style.color = "#ef4444"; // Red color
        }
      });
    </script>
  </body>
</html>
